ns">${googleDocId(d.id)?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+googleDocURL(d.id)+'">Abrir no Drive ↗</a>':`<button class="btn" data-action="attach" data-id="${d.id}">${state.files[d.id]?'Trocar PDF':'Adicionar PDF'}</button>`}<button class="btn primary" data-action="reader" data-id="${d.id}">Ler →</button></div></div>`).join('')}</div>`;

// PDFs: armazenados no IndexedDB local, nunca no GitHub.
function dbOpen(){return new Promise((resolve,reject)=>{let r=indexedDB.open('psicopita-private-pdfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(id,file){let db=await dbOpen();return new Promise((ok,bad)=>{let tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(file,id);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>bad(tx.error)})}
async function dbGet(id){let db=await dbOpen();return new Promise((ok,bad)=>{let tx=db.transaction('pdfs','readonly'),r=tx.objectStore('pdfs').get(id);r.onsuccess=()=>{db.close();ok(r.result||null)};r.onerror=()=>bad(r.error)})}
let attachingId=null, bulkPending=[];
function normalizePdfText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ')}
function renderBulkPending(){
 if(!bulkPending.length)return '';
 return '<div class="card" style="margin-bottom:18px"><h3>Arquivos que precisam de identificação</h3><p class="small muted">Nenhum arquivo duvidoso é vinculado automaticamente. Escolha o material correspondente.</p>'+
 bulkPending.map((entry,i)=>'<div class="doc" style="display:flex;gap:10px;align-items:center"><div class="doc-info"><strong>'+htmlSafe(entry.file.name)+'</strong><small>'+(entry.pages?entry.pages+' páginas':'Número de páginas não identificado')+'</small></div><select id="bulkSelect'+i+'" style="min-width:230px;max-width:420px;padding:10px"><option value="">Escolha o material...</option>'+catalog.filter(d=>!entry.pages||d.pages===entry.pages).map(d=>'<option value="'+d.id+'">'+htmlSafe(d.area+' · '+d.title+' · '+d.kind)+'</option>').join('')+'</select><button class="btn primary" data-action="bulkchoose" data-index="'+i+'">Associar</button></div>').join('')+'</div>';
}
async function importOnePdf(id,file,quiet=false){
 if(!id||!file)return;
 await dbPut(id,file);
 state.files[id]={name:file.name,size:file.size,when:nowIso(),device:true,cloud:false};
 persist();
 if(cloudClient&&cloudUser){try{await uploadCloudPDF(id,file);state.files[id].cloud=true;persist()}catch(e){if(!quiet)toast('Arquivo salvo no dispositivo, mas não na nuvem: '+(e?.message||'erro'))}}
 if(!quiet)toast('PDF associado à sua biblioteca privada.');
}
async function classifyPdf(file){
 let pages=null, cover='';
 if(window.pdfjsLib){
  let doc=null;
  try{const bytes=new Uint8Array(await file.arrayBuffer());doc=await pdfjsLib.getDocument({data:bytes,disableFontFace:true}).promise;pages=doc.numPages;const pg=await doc.getPage(1);cover=(await pg.getTextContent()).items.map(x=>x.str||'').join(' ')}catch(e){console.warn('Classificação PDF indisponível',e)}finally{try{await doc?.destroy()}catch{}}
 }
 const text=normalizePdfText(cover+' '+file.name);
 let matches=catalog.map(d=>{
  const exactPage=pages&&d.pages===pages;
  if(pages&&!exactPage)return {id:d.id,score:-100};
  const titleTokens=normalizePdfText(d.title).split(' ').filter(w=>w.length>=4&&!['parte','texto','completo','revisao','sobre','entre','para','gramatica','lingua'].includes(w));
  const hits=titleTokens.filter(w=>text.includes(w)).length;
  let score=titleTokens.length?hits/titleTokens.length:0;
  if(exactPage)score+=0.2;
  const sintetico=/pdf sintetico/.test(text);
  if(d.kind==='PDF sintético')score+=sintetico?0.26:-0.15;
  else if(sintetico)score-=0.2;
  if(d.kind==='Vade Mecum'&&/vade mecum|vademecum/.test(text))score+=0.4;
  return {id:d.id,score};
 }).sort((a,b)=>b.score-a.score);
 const best=matches[0],second=matches[1];
 return {id:best?.score>=0.88&&(!second||best.score-second.score>=0.14)?best.id:null,pages};
}
async function bulkImport(){
 let input=document.getElementById('pdfBulkInput');input.value='';input.click();
}
async function handleBulkPdfs(files){
 let arr=[...files].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
 if(!arr.length)return;
 let identified=0,failed=0;
 bulkPending=[];
 const status=document.getElementById('bulkImportStatus');
 if(status)status.innerHTML='<div class="notice blue">Identificando '+arr.length+' PDF(s); mantenha esta aba aberta.</div>';
 for(let i=0;i<arr.length;i++){
  const file=arr[i];
  try{const found=await classifyPdf(file);
   if(found.id){await importOnePdf(found.id,file,true);identified++}
   else bulkPending.push({file,pages:found.pages});
  }catch(e){console.warn(e);failed++;bulkPending.push({file,pages:null})}
  const current=document.getElementById('bulkImportStatus');
  if(current)current.textContent='Processando PDF '+(i+1)+' de '+arr.length+'…';
 }
 renderLibrary();
 let current=document.getElementById('bulkImportStatus');
 if(current)current.innerHTML='<div class="notice blue">'+identified+' PDFs associados automaticamente; '+bulkPending.length+' aguardam identificação manual.'+(failed?' Alguns arquivos não puderam ser processados.':'')+'</div>';
}
async function chooseBulk(index){
 let item=bulkPending[index],id=document.getElementById('bulkSelect'+index)?.value;
 if(!item||!id){toast('Selecione a apostila correspondente.');return}
 await importOnePdf(id,item.file,true);bulkPending.splice(index,1);renderLibrary();toast('PDF associado com sucesso.');
}
async function attach(id){attachingId=id;$('#pdfFileInput').value='';$('#pdfFileInput').click()}
async function handlePdf(file){if(!attachingId||!file)return;if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf'){toast('Escolha um arquivo PDF.');return}let id=attachingId;await dbPut(id,file);state.files[id]={name:file.name,size:file.size,when:nowIso(),device:true};persist();toast('PDF guardado na sua biblioteca privada.');if(currentView==='reader')await openReader(id,reader.day);else renderLibrary();if(cloudClient&&cloudUser)await uploadCloudPDF(id,file).catch(()=>toast('PDF salvo localmente, mas envio privado à nuvem não concluído.'))}
async function getPdfUrl(id){let file=await dbGet(id);if(file){if(reader.blobUrl)URL.revokeObjectURL(reader.blobUrl);reader.blobUrl=URL.createObjectURL(file);return reader.blobUrl}if(cloudClient&&cloudUser){let r=await cloudClient.storage.from('study-pdfs').createSignedUrl(`${cloudUser.id}/${id}.pdf`,3600);if(!r.error&&r.data?.signedUrl)return r.data.signedUrl}const driveId=googleDocId(id);if(driveId)return 'https://drive.google.com/file/d/'+encodeURIComponent(driveId)+'/preview';return null}
async function openReader(id,date){let d=catalog.find(x=>x.id===id);if(!d)return;reader.id=id;reader.day=date||null;let goal=date?calcPlan().find(x=>x.date===date&&x.id===id):null;let checked=new Set(state.read[id]||[]);let first=goal?goal.start:1,last=goal?goal.end:d.pages;let next=first;while(next<last&&checked.has(next))next++;reader.page=next;currentView='reader';$('#breadcrumb').innerHTML='Biblioteca <b>/</b> Leitor integrado';$('#main').innerHTML=`${header('Leitor de PDF',htmlSafe(d.title),'<button class="btn" data-action="library">← Voltar à biblioteca</button>')}<div class="loading">Carregando leitor privado...</div>`;let url=await getPdfUrl(id);reader.url=url;renderReader();}
function readerIsDrive(){return !!googleDocId(reader.id)&&String(reader.url||'').startsWith('https://drive.google.com/file/d/')}
function updateReaderTracking(){
 let d=catalog.find(x=>x.id===reader.id);if(!d||currentView!=='reader')return;
 let goal=reader.day?calcPlan().find(x=>x.date===reader.day&&x.id===d.id):null;
 let min=goal?goal.start:1,max=goal?goal.end:d.pages,seen=state.read[d.id]||[];
 reader.page=Math.min(max,Math.max(min,reader.page));
 let checked=seen.includes(reader.page);
 let setText=(id,value)=>{let el=document.getElementById(id);if(el)el.textContent=value};
 setText('readerFrameStatus','Página para confirmar: '+reader.page+' de '+d.pages);
 setText('readerPageCounter',reader.page+' / '+d.pages);
 setText('readerProgressText',goal?dayProgress(goal).read+'/'+goal.pages+' páginas da meta':seen.length+'/'+d.pages+' páginas confirmadas');
 let bar=document.getElementById('readerProgressBar');
 if(bar)bar.innerHTML=goal?progress(dayProgress(goal).read,goal.pages):progress(seen.length,d.pages);
 let prev=document.querySelector('[data-action="prevpage"]');
 let next=document.querySelector('[data-action="nextpage"]');
 let mark=document.querySelector('[data-action="markpage"]');
 if(prev)prev.disabled=reader.page<=min;
 if(next)next.disabled=reader.page>=max;
 if(mark){mark.disabled=!reader.url||checked;mark.textContent=checked?'✓ Página já confirmada':'✓ Li a página '+reader.page}
 // PDFs locais permitem saltar para a página. O iframe privado do Drive não tem API de navegação.
 if(!readerIsDrive()){
  const iframe=document.getElementById('readerDocument');
  if(iframe&&reader.url){
   const src=reader.url+'#page='+reader.page+'&zoom=page-width';
   if(iframe.getAttribute('src')!==src)iframe.setAttribute('src',src);
  }
 }
}
function moveReaderPage(delta){
 let d=catalog.find(x=>x.id===reader.id);if(!d)return;
 let goal=reader.day?calcPlan().find(x=>x.date===reader.day&&x.id===d.id):null;
 reader.page=Math.min(goal?goal.end:d.pages,Math.max(goal?goal.start:1,reader.page+delta));
 updateReaderTracking();
}

function renderReader(){let d=catalog.find(x=>x.id===reader.id);if(!d)return;let goal=reader.day?calcPlan().find(x=>x.date===reader.day&&x.id===d.id):null;let min=goal?goal.start:1,max=goal?goal.end:d.pages,seen=state.read[d.id]||[],isChecked=seen.includes(reader.page);reader.page=Math.min(max,Math.max(min,reader.page));
 $('#main').innerHTML=header('Leitor de PDF',htmlSafe(d.title),'<button class="btn" data-action="library">← Biblioteca</button>')+`<div class="reader-layout"><div class="card reader-document-card"><div class="reader-toolbar"><div class="reader-titleline"><span class="badge">${htmlSafe(d.area)}</span> <span class="badge goldish">${goal?`Meta ${min}–${max}`:'Consulta livre'}</span><span class="status" id="readerFrameStatus">Página para confirmar: ${reader.page} de ${d.pages}</span></div><div class="reader-actions"><button class="btn" data-action="fullscreenreader" title="Ampliar PDF em tela cheia">⛶ Tela cheia</button></div></div><div class="reader-frame" id="readerFrame">${reader.url?`<iframe id="readerDocument" title="${htmlSafe(d.title)}" src="${htmlSafe(reader.url)}${readerIsDrive()?'':'#page='+reader.page+'&zoom=page-width'}" referrerpolicy="no-referrer" allowfullscreen loading="eager"></iframe>`:`<div class="empty"><div class="hint-icon">▤</div><h3>PDF ainda não carregado</h3><p>O arquivo original fica sob seu controle. Adicione-o na biblioteca para usar este leitor.</p><button class="btn primary" data-action="attach" data-id="${d.id}">Adicionar PDF ao dispositivo</button></div>`}</div><div class="reader-nav"><button class="btn" data-action="prevpage" ${reader.page<=min?'disabled':''}>← Página a confirmar</button><strong class="small" id="readerPageCounter">${reader.page} / ${d.pages}</strong><button class="btn" data-action="nextpage" ${reader.page>=max?'disabled':''}>Próxima a confirmar →</button></div>${readerIsDrive()?'<p class="reader-instructions"><strong>Como usar:</strong> passe as páginas dentro do PDF usando a rolagem e os controles do Google Drive. Os botões acima alteram apenas a página que o PsicoPita registra; não movimentam a prévia. Confirmar uma página não reinicia mais o PDF.</p>':'<p class="reader-instructions">Use as setas para navegar no PDF. Confirme a página somente depois da leitura.</p>'}</div>
 <div class="card reader-progress-card"><h3>${goal?'Leitura dirigida do dia':'Acompanhamento de leitura'}</h3><p class="small muted">${goal?`Leia somente as páginas ${goal.start} a ${goal.end} no roteiro. Para consultar outras páginas, use a opção de leitura livre.`:'Consulta livre à apostila. A leitura será registrada somente quando você confirmar uma página.'}</p><div id="readerProgressBar">${goal?progress(dayProgress(goal).read,goal.pages):progress(seen.length,d.pages)}</div><div class="stage-summary"><span id="readerProgressText">${goal?`${dayProgress(goal).read}/${goal.pages} páginas da meta`:`${seen.length}/${d.pages} páginas confirmadas`}</span></div><button class="btn primary" ${!reader.url||isChecked?'disabled':''} data-action="markpage">${isChecked?'✓ Página já confirmada':'✓ Li a página '+reader.page}</button><p class="help">Abrir um PDF não conta como leitura: confirme ao terminar. A prévia do Google Drive pode não acompanhar os botões da agenda; confira a página indicada antes de confirmar. Se aparecer uma tela de acesso, entre com sua conta Google.</p>${googleDocId(d.id)?`<p class="help">Se precisar de mais zoom ou a prévia não abrir, utilize o leitor do Google Drive em outra aba:</p><a class="btn" target="_blank" rel="noopener noreferrer" href="${googleDocURL(d.id)}">Abrir PDF original no Google Drive ↗</a>`:''}${goal?`<button class="btn" data-action="freeread">Consultar PDF completo</button>`:''}${goal&&nextStage(goal)!=='read'?`<div class="divider"></div><button class="btn gold" data-action="day" data-date="${goal.date}">Avançar para ${nextStage(goal)==='quiz'?'questões':nextStage(goal)==='flash'?'flashcards':'agenda'} →</button>`:''}</div></div>`;
}
function markPage(){if(!reader.url){toast('Entre no Google Drive para abrir a apostila.');return}let id=reader.id;state.read[id]=state.read[id]||[];if(!state.read[id].includes(reader.page))state.read[id].push(reader.page);persist();let g=reader.day?calcPlan().find(x=>x.date===reader.day):null;if(g&&dayProgress(g).read===g.pages){toast('Meta de leitura concluída! Agora vêm as questões.');startQuestions(g.area,10,g.date);return}let max=g?g.end:catalog.find(x=>x.id===id).pages;if(reader.page<max)reader.page++;updateReaderTracking()}
function resume(){let d=dashboardToday();if(d)startDay(d.date);else show('agenda')}
function startDay(date){let d=calcPlan().find(x=>x.date===date);if(!d||d.rest)return;const stage=nextStage(d);if(stage==='read')openReader(d.id,d.date);else if(stage==='quiz')startQuestions(d.area,10,d.date);else if(stage==='flash')startFlash(d.area,d.date);else show('agenda')}
function pool(area){return QUESTION_BANK.map((q,i)=>({...{subject:q[0],question:q[1],options:q[2],answer:q[3],explain:q[4],topic:q[5]},id:i})).filter(q=>!area||q.subject===area)}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuestions(area,count=10,day=null,sim=false){let ids=sim?[...shuffled(pool('Português')).slice(0,10),...shuffled(pool('Inglês')).slice(0,10),...shuffled(pool('Psicologia')).slice(0,50)].map(q=>q.id):shuffled(pool(area)).slice(0,count).map(q=>q.id);state.session={ids,at:0,day,area:area||'Todas',sim,results:[],started:nowIso()};persist();renderQuestions()}
function renderQuestions(){currentView='questions';let s=state.session;
 if(!s){$('#main').innerHTML=header('Questões e simulados','Questões autorais baseadas nos assuntos do edital, com gabarito comentado e identificação da disciplina.')+`<div class="notice blue">Questões elaboradas para estudo. Não são reproduções de provas nem possuem garantia de prever questões da Cesgranrio.</div><div class="grid third">${subjects.map(a=>`<div class="card"><h3>${a}</h3><p class="small muted">${pool(a).length} questões originais disponíveis</p><button class="btn primary" data-action="startquiz" data-area="${a}">Treinar 10 questões →</button></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Simulado de 70 questões</h3><p class="small muted">10 de Português + 10 de Inglês + 50 de Psicologia. Questões autorais, com correção e registro de desempenho.</p><button class="btn gold" data-action="startsim">Iniciar simulado de 70 questões →</button></div>`;return}
 let total=s.ids.length,position=s.at;if(position>=total){let correct=s.results.filter(x=>x.correct).length;$('#main').innerHTML=header('Atividade concluída','Seu resultado foi registrado no histórico de estudos.')+`<div class="card" style="max-width:740px"><div class="eyebrow">SEU RESULTADO</div><div class="metric-number">${correct}/${total}</div><h3>${Math.round(100*correct/total)}% de acertos</h3><p>Você respondeu a ${total} questões ${s.sim?'no simulado':'na atividade de treino'}.</p>${progress(correct,total)}<button class="btn primary" data-action="finishquiz">${s.day?'Seguir para revisão →':'Finalizar →'}</button></div>`;return}
 let id=s.ids[position],q=pool().find(x=>x.id===id),result=s.results.find(x=>x.position===position);$('#main').innerHTML=header(s.sim?'Simulado Cesgranrio — modelo':'Questões comentadas',s.day?`Etapa 2 do roteiro · ${formatDay(s.day)}`:'Treino de fixação com respostas fundamentadas.')+`<div class="card" style="max-width:880px"><div class="split"><span class="badge">${htmlSafe(q.subject)} · ${htmlSafe(q.topic)}</span><span class="status">Questão ${position+1} de ${total}</span></div>${progress(position,total)}<div class="question"><h3>${htmlSafe(q.question)}</h3>${q.options.map((opt,i)=>`<button class="option ${result?(i===q.answer?'correct':i===result.choice?'wrong':''):''}" data-action="answer" data-choice="${i}" ${result?'disabled':''}><span class="choice-badge">${letters[i]}</span><span>${htmlSafe(opt)}</span></button>`).join('')}${result?`<div class="explanation"><strong>${result.correct?'Resposta correta!':'Resposta incorreta.'} Gabarito: ${letters[q.answer]}.</strong><p>${htmlSafe(q.explain)}</p></div><button class="btn primary" data-action="nextquestion">${position===total-1?'Ver meu resultado →':'Próxima questão →'}</button>`:''}</div></div><button class="btn" style="margin-top:18px" data-action="stopquiz">Sair e conservar progresso</button>`;
}
function answer(choice){let s=state.session;if(!s||s.at>=s.ids.length||s.results.some(x=>x.position===s.at))return;let id=s.ids[s.at],q=pool().find(x=>x.id===id),right=Number(choice)===q.answer;let res={id,choice:Number(choice),correct:right,position:s.at,date:nowIso(),subject:q.subject,topic:q.topic};s.results.push(res);state.answers.push(res);persist();renderQuestions()}
function finishQuiz(){let s=state.session;if(!s)return;if(s.sim)state.simulations.push({date:nowIso(),results:s.results.length,correct:s.results.filter(x=>x.correct).length});let day=s.day,area=s.area;if(day&&s.results.length===s.ids.length){state.agenda[day]=state.agenda[day]||{};state.agenda[day].quiz=true}state.session=null;persist();if(day)startFlash(area,day);else show('dashboard')}
const cards=QUESTION_BANK.map((q,i)=>({id:'f'+i,area:q[0],front:q[1],back:q[4]}));
let flashSession=null;
function startFlash(area=null,day=null){flashSession={area,day,cardList:shuffled(cards.filter(c=>!area||c.area===area)).slice(0,day?5:10),at:0,flipped:false};renderReview()}
function renderReview(){currentView='review';let fs=flashSession;if(!fs){$('#main').innerHTML=header('Flashcards e revisões','Recupere o conhecimento ativamente e registre os cartões revisados.')+`<div class="grid third">${subjects.map(a=>`<div class="card"><h3>${a}</h3><p class="small muted">${cards.filter(c=>c.area===a).length} cartões disponíveis</p><button class="btn primary" data-action="startcards" data-area="${a}">Revisar →</button></div>`).join('')}</div><div class="notice blue">Flashcards usam perguntas autorais e explicações resumidas; não reproduzem o texto protegido das apostilas.</div>`;return}
 if(fs.at>=fs.cardList.length){$('#main').innerHTML=header('Revisão concluída','Mais uma etapa encerrada na sua preparação.')+`<div class="card"><h3>${fs.cardList.length} cartões revisados</h3><button class="btn primary" data-action="finishcards">${fs.day?'Concluir roteiro diário →':'Voltar ao painel →'}</button></div>`;return}
 let c=fs.cardList[fs.at];$('#main').innerHTML=header('Revisão ativa',fs.day?`Etapa 3 do roteiro · ${formatDay(fs.day)}`:'Relembre o conteúdo antes de revelar a explicação.')+`<div class="card" style="max-width:840px"><div class="split"><span class="badge">${htmlSafe(c.area)}</span><span class="status">Cartão ${fs.at+1} / ${fs.cardList.length}</span></div>${progress(fs.at,fs.cardList.length)}<button class="flashcard" style="width:100%" data-action="flipcard"><div><small>${fs.flipped?'EXPLICAÇÃO':'PERGUNTA · CLIQUE PARA REVELAR'}</small><h3>${htmlSafe(fs.flipped?c.back:c.front)}</h3><p class="muted small">${fs.flipped?'Clique para voltar à pergunta':'Toque no cartão para revelar a resposta'}</p></div></button><div style="margin-top:17px">${fs.flipped?`<button class="btn primary" data-action="flashnext">Entendi, próximo cartão →</button>`:`<button class="btn" data-action="flipcard">Revelar resposta</button>`}</div></div>`;
}
function nextFlash(){let fs=flashSession,c=fs.cardList[fs.at];state.flash[`${fs.day||today()}-${c.id}`]=nowIso();fs.at++;fs.flipped=false;persist();renderReview()}
function finishCards(){if(flashSession?.day){state.agenda[flashSession.day]=state.agenda[flashSession.day]||{};state.agenda[flashSession.day].flash=true;persist();toast('Roteiro diário concluído!')}flashSession=null;show(flashSession?'review':'dashboard')}
function renderTutor(){let active=!!(cloudClient&&cloudUser);$('#main').innerHTML=header('Tutor de inteligência artificial','Assistente para tirar dúvidas de Português, Inglês e Psicologia, conectado por backend seguro.')+`<div class="card" style="max-width:820px"><div class="tutor-chat" id="tutorOutput"><div><div class="hint-icon">✧</div><h3>${active?'Tutor IA · verificar conexão do servidor':'Tutor IA — aguardando configuração'}</h3><p>${active?'Você está autenticado. O assistente responderá quando a função segura study-tutor estiver publicada no seu Supabase, com chave de IA configurada.':'Para ativar o tutor, conecte sua conta ao Supabase em Configurações, publique a função protegida study-tutor e configure o provedor de IA no servidor.'}</p><p>O tutor ainda não pesquisa nos seus PDFs automaticamente nem deve citar páginas que não consultou.</p></div></div>${active?`<div style="margin-top:16px;display:grid;gap:10px"><label for="tutorQuestion" class="small">Escreva sua dúvida</label><textarea id="tutorQuestion" placeholder="Ex.: Explique a diferença entre clima e cultura organizacional com um exemplo" rows="4" style="width:100%;padding:13px;border:1px solid #d7e4e6;border-radius:12px;font:inherit"></textarea><button class="btn primary" data-action="askTutor">Perguntar ao tutor →</button></div>`:`<button class="btn" data-action="settings">Configurar Supabase →</button>`}</div><div class="notice">Nunca informe uma chave secreta de IA no navegador. Perguntas são enviadas à função autenticada quando o tutor estiver configurado.</div>`}
async function askTutor(){if(!cloudClient||!cloudUser){toast('Entre com sua conta para usar o tutor.');return}let question=$('#tutorQuestion')?.value.trim();if(!question||question.length<5){toast('Digite uma pergunta com pelo menos cinco caracteres.');return}const el=$('#tutorOutput');el.textContent='Consultando tutor com segurança…';let button=document.querySelector('[data-action="askTutor"]');button.disabled=true;try{let {data,error}=await cloudClient.functions.invoke('study-tutor',{body:{question}});if(error)throw Error(error.message);if(!data?.reply)throw Error(data?.error||'Tutor não disponível.');el.innerHTML=`<div style="width:100%;text-align:left"><p class="small muted"><strong>Sua dúvida</strong>: ${htmlSafe(question)}</p><div class="divider"></div><div class="small" style="white-space:pre-wrap;line-height:1.8;color:#234451">${htmlSafe(data.reply)}</div></div>`}catch(e){el.innerHTML=`<div><h3>Tutor ainda indisponível</h3><p>Não foi possível obter resposta. Verifique a implantação da função study-tutor e o segredo do provedor de IA no Supabase.</p><p class="small muted">As atividades de leitura e questões permanecem disponíveis.</p></div>`}finally{button.disabled=false}}
function renderSettings(){
 const v=state.settings;
 const authenticated=!!(cloudUser&&cloudClient);
 $('#main').innerHTML=header('Configurações','Organize sua rotina no fuso de Manaus e acompanhe a sincronização privada dos seus estudos.')+
 `<div class="grid two"><div class="card"><h3>Disponibilidade de estudo</h3>
 <p class="small muted">Agenda no fuso America/Manaus (UTC−4). O servidor Supabase está em São Paulo.</p>
 <form id="studySettings" class="settings-form">
 <label>Início do plano<input type="date" name="startDate" value="${htmlSafe(v.startDate)}" required></label>
 <label>Minutos por dia<input type="number" min="30" max="480" step="15" name="minutes" value="${v.minutes}"></label>
 <label>Ritmo de leitura (páginas/hora)<input type="number" min="3" max="30" name="pagesPerHour" value="${v.pagesPerHour}"></label>
 <label>Dias de estudo</label><div class="day-grid">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((name,i)=>`<label><input type="checkbox" name="day" value="${i}" ${v.days.includes(i)?'checked':''}>${name}</label>`).join('')}</div>
 <button class="btn primary" type="submit">Salvar e recalcular agenda</button></form></div>
 <div class="card"><h3>Minha conta e sincronização</h3>
 <div class="notice blue"><strong>${authenticated?'✓ Autenticado':'✓ Supabase conectado'}</strong><p class="small">${authenticated?'Conta: '+htmlSafe(cloudUser.email||cloudUser.id)+' — seus dados podem ser sincronizados entre dispositivos.':'O banco privado está configurado. Entre para manter seu progresso entre computador e celular.'}</p></div>
 ${authenticated?`<button class="btn" data-action="logout">Sair da conta</button>`:
 `<label class="small" for="cloudEmail">Entrar por e-mail</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
 <input id="cloudEmail" type="email" autocomplete="email" placeholder="Seu e-mail" style="padding:10px;border:1px solid #d7e4e6;border-radius:10px;flex:1;min-width:190px">
 <button class="btn primary" data-action="login">Receber link de acesso</button></div>
 <p class="small muted">Um link é enviado ao seu e-mail. O redirecionamento para este site precisa estar autorizado no Supabase.</p>`}
 <div class="divider"></div><h3>Entrar com Google</h3>
 <p class="small muted">A conta Google será usada apenas para autenticação. Os arquivos originais permanecem privados no Google Drive, sem precisar de outro upload.</p>
 ${authenticated?'<p class="small">✓ Sessão autenticada.</p>':GOOGLE_OAUTH_READY?'<button class="btn gold" data-action="loginGoogle">Entrar com Google</button>':'<button class="btn gold" disabled>Login Google — configuração pendente</button>'}
 <p class="small muted">Login Google habilitado para teste. Se o Google bloquear o acesso, confira sua conta em Google Cloud → Público → Usuários de teste. Não compartilhe segredos de autenticação nem os coloque no GitHub.</p>
 <a class="btn" href="https://supabase.com/dashboard/project/nyfovlposbehjufececz/auth/providers" target="_blank" rel="noopener noreferrer">Ver autenticação no Supabase ↗</a>
 <div class="divider"></div><h3>Biblioteca particular</h3>
 <p class="small muted">54 PDFs já vinculados à sua pasta Google Drive. Para abrir os documentos, o navegador deve estar conectado à conta Google que possui acesso.</p>
 <button class="btn" data-action="library">Abrir biblioteca</button>
 <div class="divider"></div><h3>Backup dos estudos</h3>
 <p class="small muted">Se não estiver autenticado, o progresso continua salvo somente neste navegador.</p>
 <div class="toolbar"><button class="btn" data-action="export">Exportar progresso</button><button class="btn" data-action="import">Importar progresso</button></div></div></div>`;
 $('#studySettings').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),days=fd.getAll('day').map(Number);
 if(!days.length){toast('Escolha pelo menos um dia para estudar.');return}
 state.settings={startDate:fd.get('startDate'),minutes:Math.min(480,Math.max(30,Number(fd.get('minutes'))||90)),pagesPerHour:Math.min(30,Math.max(3,Number(fd.get('pagesPerHour'))||8)),days};
 persist();toast('Agenda recalculada!');show('agenda');
 };
}
function exportData(){let copy=clone(state);delete copy.session;const blob=new Blob([JSON.stringify({app:'PsicoPita Estuda IA',exportedAt:nowIso(),state:copy},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='psicopita-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(file){file.text().then(txt=>{let a=JSON.parse(txt);if(a.app!=='PsicoPita Estuda IA'||!a.state?.settings)throw Error('Formato inválido');state={...clone(DEFAULT),...a.state};persist();toast('Progresso restaurado. Os PDFs já estão vinculados ao Google Drive.');show('dashboard')}).catch(()=>toast('Não foi possível importar este arquivo.'))}
async function setupCloud(){
 if(!window.supabase?.createClient){cloudClient=null;cloudUser=null;console.warn('Biblioteca Supabase JS indisponível');return}
 try{
  cloudClient=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await cloudClient.auth.getUser();
  if(error&&error.name!=='AuthSessionMissingError')console.warn('Verificação de conta',error.message);
  cloudUser=data?.user||null;
  cloudClient.auth.onAuthStateChange((event,session)=>{
   const next=session?.user||null;
   const changed=cloudUser?.id!==next?.id;
   cloudUser=next;
   // Não executar chamadas Supabase dentro do callback de autenticação.
   setTimeout(async()=>{
    if(cloudUser&&(changed||event==='SIGNED_IN'||event==='INITIAL_SESSION'))await syncDown();
    if(currentView==='settings')renderSettings();
    else if(currentView==='dashboard')renderDashboard();
   },0);
  });
  if(cloudUser)await syncDown();
 }catch(e){console.warn('Supabase indisponível',e);cloudClient=null;cloudUser=null}
}
async function loginGoogle(){
 if(!cloudClient){toast('Sincronização indisponível.');return}
 if(!GOOGLE_OAUTH_READY){toast('O provedor Google ainda precisa ser autorizado no Supabase.');return}
 const {error}=await cloudClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,scopes:'openid email profile'}});
 if(error)toast('Falha no login Google: '+error.message);
}
async function login(){
 if(!cloudClient){toast('Serviço de login indisponível.');return}
 const email=$('#cloudEmail')?.value.trim();
 if(!email||!email.includes('@')){toast('Informe um e-mail válido.');return}
 const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
 toast(error?'Falha no login: '+error.message:'Link solicitado. Verifique sua caixa de e-mail e spam.');
}
let syncDownPromise=null;
async function syncDown(){
 if(!cloudClient||!cloudUser)return;
 if(syncDownPromise)return syncDownPromise;
 syncDownPromise=(async()=>{
  try{
   const user=cloudUser;
   const owner=localStorage.getItem('psicopita-account-owner');
   if(owner&&owner!==user.id){
    state=clone(DEFAULT);
    localStorage.setItem(key,JSON.stringify(state));
   }
   localStorage.setItem('psicopita-account-owner',user.id);
   const {data,error}=await cloudClient.from('study_state').select('payload,updated_at').eq('user_id',user.id).maybeSingle();
   if(error)throw error;
   if(cloudUser?.id!==user.id)return;
   const remoteTime=Date.parse(data?.updated_at||'')||0;
   const localTime=Date.parse(state.updatedAt||'')||0;
   if(data?.payload&&(remoteTime>localTime||!localTime)){
    state={...clone(DEFAULT),...data.payload,updatedAt:data.updated_at};
    state.settings={...DEFAULT.settings,...(state.settings||{})};
    localStorage.setItem(key,JSON.stringify(state));
    if(currentView==='dashboard'||currentView==='agenda'||currentView==='settings')show(currentView);
    toast('Progresso sincronizado com sua conta.');
   }else if(localTime||!data){await syncUp();}
  }catch(e){console.warn('Falha ao sincronizar progresso',e);toast('Sincronização pendente. Seu progresso continua salvo neste navegador.')}
 })();
 try{await syncDownPromise}finally{syncDownPromise=null}
}
async function syncUp(){
 if(!cloudClient||!cloudUser)return;
 const copy=clone(state); const uid=cloudUser.id;
 try{
  const {error}=await cloudClient.from('study_state').upsert({user_id:uid,payload:copy,updated_at:copy.updatedAt||nowIso()},{onConflict:'user_id'});
  if(error)throw error;
 }catch(e){console.warn('Sincronização com Supabase indisponível',e?.message||e)}
}
async function uploadCloudPDF(id,file){if(!cloudClient||!cloudUser)return;let {error}=await cloudClient.storage.from('study-pdfs').upload(`${cloudUser.id}/${id}.pdf`,file,{upsert:true,contentType:'application/pdf'});if(error)throw error}
async function logout(){if(cloudClient&&cloudUser)await syncUp();if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;state=clone(DEFAULT);localStorage.setItem(key,JSON.stringify(state));renderSettings();toast('Você saiu da conta. Seus dados sincronizados continuam protegidos no Supabase.')}
async function handleAction(b){let act=b.dataset.action;try{if(['dashboard','agenda','library','questions','review','tutor','settings'].includes(act)){state.session=act==='questions'?state.session:state.session;show(act);return}switch(act){case 'resume':resume();break;case 'day':startDay(b.dataset.date);break;case 'attach':attach(b.dataset.id);break;case 'bulkimport':bulkImport();break;case 'bulkchoose':await chooseBulk(Number(b.dataset.index));break;case 'reader':openReader(b.dataset.id,null);break;case 'prevpage':moveReaderPage(-1);break;case 'nextpage':moveReaderPage(1);break;case 'fullscreenreader':await readerFullscreen();break;case 'markpage':markPage();break;case 'freeread':openReader(reader.id,null);break;case 'startquiz':startQuestions(b.dataset.area,10);break;case 'startsim':startQuestions(null,70,null,true);break;case 'answer':answer(b.dataset.choice);break;case 'nextquestion':state.session.at++;persist();renderQuestions();break;case 'stopquiz':state.session=null;persist();show('questions');break;case 'finishquiz':finishQuiz();break;case 'startcards':startFlash(b.dataset.area);break;case 'flipcard':flashSession.flipped=!flashSession.flipped;renderReview();break;case 'flashnext':nextFlash();break;case 'finishcards':finishCards();break;case 'export':exportData();break;case 'import':$('#restoreInput').click();break;case 'login':login();break;case 'loginGoogle':loginGoogle();break;case 'logout':logout();break;case 'askTutor':askTutor();break;default:break}}catch(e){console.error(e);toast('Não foi possível executar. Tente novamente.')}}
async function start(){try{catalog=JSON.parse(document.getElementById('embedded-catalog').textContent)}catch{catalog=[];toast('Catálogo indisponível; abra o site pela hospedagem HTTP.')}document.body.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handleAction(b)});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));$('#mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');$('#pdfFileInput').addEventListener('change',e=>handlePdf(e.target.files[0]));$('#pdfBulkInput').addEventListener('change',e=>handleBulkPdfs(e.target.files));$('#restoreInput').addEventListener('change',e=>e.target.files[0]&&importData(e.target.files[0]));await setupCloud();show('dashboard')}
start();

</script>
