    from=null;
   }
  }
 }
 return runs;
}

const MOCK_LABELS=['Diagnóstico inicial','Avaliação intermediária','Avaliação final'];
function benchmarkDates(){
 const cfg=state.settings;
 const allowed=Array.isArray(cfg.days)&&cfg.days.length?cfg.days:[1,2,3,4,5,6];
 let first=cfg.startDate||today();
 if(first<'2026-10-21')first='2026-10-21';
 const last='2026-12-05';
 if(first>=last)first='2026-10-21';
 while(!allowed.includes(dateOf(first).getDay())&&first<last)first=stepDate(first,1);
 const distance=Math.round((dateOf(last).getTime()-dateOf(first).getTime())/86400000);
 let mid=stepDate(first,Math.floor(distance/2));
 for(let i=0;i<7&&!allowed.includes(dateOf(mid).getDay());i++)mid=stepDate(mid,1);
 if(mid===first||mid===last)mid=stepDate(first,Math.max(1,Math.floor(distance/2)-1));
 return [{index:0,date:first,title:MOCK_LABELS[0]},{index:1,date:mid,title:MOCK_LABELS[1]},{index:2,date:last,title:MOCK_LABELS[2]}];
}
const EXAM_SUBJECTS=['Português','Inglês','Psicologia'];
function examBlueprint(){
 const parts=window.PSICOPITA_EXAM_PARTS||{};
 return EXAM_SUBJECTS.flatMap(subject=>(parts[subject]||[]).map((item,i)=>({...item,subject,blueprintId:subject+'-'+i})));
}
function getExamQuestions(index){
 if(![0,1,2].includes(index))return [];
 const book=examBlueprint();
 return book.map((f,i)=>{
  const rotate=(i*3+index*2)%5;
  const choices=f.vo?.[index]||f.o;
  const options=choices.map((_,j)=>choices[(j-rotate+5)%5]);
  return {id:'benchmark-'+index+'-'+i,subject:f.subject,question:f.q[index],
   options,answer:(f.a+rotate)%5,explain:f.e,topic:f.t,sourceId:f.d,
   difficulty:f.level||3,blueprintId:f.blueprintId};
 });
}
function examBlueprintReady(){
 const q=getExamQuestions(0);
 return q.length===70&&EXAM_SUBJECTS.every((a,i)=>q.filter(x=>x.subject===a).length===[10,10,50][i])
  &&q.every(x=>x.options.length===5&&x.question&&x.explain);
}
function calcPlan(){
 const cfg=state.settings;
 const sims=benchmarkDates();
 const booked=new Set(sims.map(x=>x.date));
 const start=sims[0].date;
 const daysAvailable=Array.isArray(cfg.days)&&cfg.days.length?cfg.days:[1,2,3,4,5,6];
 const cap=Math.min(200,Math.max(1,Number(cfg.pagesPerDay)||200));
 const fingerprint=JSON.stringify({start,days:daysAvailable.slice().sort(),cap,version:5,
  mocks:sims.map(d=>d.date),books:primaryDocs().map(d=>[d.id,d.pages])});
 if(state.planSnapshot?.fingerprint===fingerprint&&Array.isArray(state.planSnapshot.days))return state.planSnapshot.days;
 const runs=unreadRuns();
 const total=runs.reduce((sum,r)=>sum+r.pages,0);
 const dayCount=Math.ceil(total/cap);
 const base=dayCount?Math.floor(total/dayCount):0,remainder=dayCount?total%dayCount:0;
 let pointer=0,offset=0,date=stepDate(start,1);
 const plan=[];
 for(let k=0;k<dayCount;k++){
  while(!daysAvailable.includes(dateOf(date).getDay())||booked.has(date))date=stepDate(date,1);
  let remaining=base+(k<remainder?1:0);const chunks=[];
  while(remaining>0&&pointer<runs.length){
   const run=runs[pointer],count=Math.min(remaining,run.pages-offset),from=run.start+offset;
   chunks.push({id:run.id,area:run.area,title:run.title,start:from,end:from+count-1,pages:count});
   remaining-=count;offset+=count;
   if(offset>=run.pages){pointer++;offset=0}
  }
  plan.push({date,kind:'reading',chunks,pages:chunks.reduce((n,c)=>n+c.pages,0),
   area:[...new Set(chunks.map(c=>c.area))].join(' + '),rest:false});
  date=stepDate(date,1);
 }
 for(const sim of sims)plan.push({date:sim.date,kind:'simulation',simIndex:sim.index,
  title:sim.title,pages:0,chunks:[],rest:false,area:'Simulado completo'});
 plan.sort((a,b)=>a.date.localeCompare(b.date));
 state.planSnapshot={fingerprint,days:plan,createdAt:nowIso()};
 // Cada nova estrutura de datas é recalculada, sem apagar páginas nem respostas existentes.
 state.agenda={};
 localStorage.setItem(key,JSON.stringify(state));
 return plan;
}
function feasibility(){
 const cfg=state.settings,deadline='2026-12-05';
 const docs=primaryDocs(),total=docs.reduce((n,d)=>n+d.pages,0);
 const seen=docs.reduce((n,d)=>n+confirmedPagesFor(d),0),remaining=Math.max(0,total-seen);
 const cap=Math.min(200,Math.max(1,Number(cfg.pagesPerDay)||200));
 const sims=benchmarkDates(),reserved=new Set(sims.map(d=>d.date));
 let dt=sims[0].date,workDays=0;
 const allowed=Array.isArray(cfg.days)&&cfg.days.length?cfg.days:[1,2,3,4,5,6];
 while(dt<=deadline){if(allowed.includes(dateOf(dt).getDay())&&!reserved.has(dt))workDays++;dt=stepDate(dt,1)}
 const reads=calcPlan().filter(d=>d.kind==='reading'),last=reads.length?reads[reads.length-1].date:null;
 return {total,seen,remaining,docs:docs.length,workDays,cap,neededDays:reads.length,last,
  simulations:sims,requiredPagesPerDay:workDays?Math.ceil(remaining/workDays):null,
  possible:!last||last<=deadline,deadline};
}

function dayProgress(day){
 if(!day)return {read:0,quiz:false,flash:false,simulation:false};
 if(day.kind==='simulation')return {read:0,quiz:false,flash:false,simulation:!!state.mockResults?.[day.simIndex]};
 let read=0;
 for(const c of day.chunks){
  const seen=new Set((state.read[c.id]||[]).map(Number));
  if(docState(c.id).completedAt){read+=c.pages;continue}
  for(let p=c.start;p<=c.end;p++)if(seen.has(p))read++;
 }
 const status=state.agenda[day.date]||{};
 return {read,quiz:!!status.quiz,flash:!!status.flash,simulation:false};
}
function dayDone(date){
 const day=calcPlan().find(d=>d.date===date);
 if(!day)return false;
 if(day.kind==='simulation')return !!state.mockResults?.[day.simIndex];
 const p=dayProgress(day);return p.read===day.pages&&p.quiz&&p.flash;
}
function nextStage(day){
 if(day.kind==='simulation')return state.mockResults?.[day.simIndex]?'finished':'mock';
 const p=dayProgress(day);return p.read<day.pages?'read':!p.quiz?'quiz':!p.flash?'flash':'finished';
}

function remainingChunk(day){
 return day?.chunks?.find(c=>{
  if(docState(c.id).completedAt)return false;
  const seen=new Set((state.read[c.id]||[]).map(Number));
  for(let p=c.start;p<=c.end;p++)if(!seen.has(p))return true;
  return false;
 })||null;
}
function chunkReadCount(c){
 if(docState(c.id).completedAt)return c.pages;
 const seen=new Set((state.read[c.id]||[]).map(Number));
 let n=0;for(let p=c.start;p<=c.end;p++)if(seen.has(p))n++;
 return n;
}

async function dbPut(id,file){let db=await dbOpen();return new Promise((ok,bad)=>{let tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(file,id);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>bad(tx.error)})}

async function importOnePdf(id,file,quiet=false){
 if(!id||!file)return;
 await dbPut(id,file);
 state.files[id]={name:file.name,size:file.size,when:nowIso(),device:true,cloud:false};
 persist();
 if(cloudClient&&cloudUser){try{await uploadCloudPDF(id,file);state.files[id].cloud=true;persist()}catch(e){if(!quiet)toast('Arquivo salvo no dispositivo, mas não na nuvem: '+(e?.message||'erro'))}}

}
async function classifyPdf(file){
 let pages=null, cover='';
 if(window.pdfjsLib){
  let doc=null;
  try{const bytes=new Uint8Array(await file.arrayBuffer());doc=await pdfjsLib.getDocument({data:bytes,disableFontFace:true}).promise;pages=doc.numPages;const pg=await doc.getPage(1);cover=(await pg.getTextContent()).items.map(x=>x.str||'').join(' ')}catch(e){console.warn('Classificação PDF indisponível',e)}finally{try{await doc?.destroy()}catch{}}
 }
 const text=normalizePdfText(cover+' '+file.name);
 let matches=catalog.map(d=>{
  const exactPage=pages&&d.pages===pages;
  if(pages&&!exactPage)return {id:d.id,score:-100};
  const titleTokens=normalizePdfText(d.title).split(' ').filter(w=>w.length>=4&&!['parte','texto','completo','revisao','sobre','entre','para','gramatica','lingua'].includes(w));
  const hits=titleTokens.filter(w=>text.includes(w)).length;
  let score=titleTokens.length?hits/titleTokens.length:0;
  if(exactPage)score+=0.2;
  const sintetico=/pdf sintetico/.test(text);
  if(d.kind==='PDF sintético')score+=sintetico?0.26:-0.15;
  else if(sintetico)score-=0.2;
  if(d.kind==='Vade Mecum'&&/vade mecum|vademecum/.test(text))score+=0.4;
  return {id:d.id,score};
 }).sort((a,b)=>b.score-a.score);
 const best=matches[0],second=matches[1];
 return {id:best?.score>=0.88&&(!second||best.score-second.score>=0.14)?best.id:null,pages};
}

async function handleBulkPdfs(files){
 let arr=[...files].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
 if(!arr.length)return;
 let identified=0,failed=0;
 bulkPending=[];
 const status=document.getElementById('bulkImportStatus');
 if(status)status.innerHTML='<div class="notice blue">Identificando '+arr.length+' PDF(s); mantenha esta aba aberta.</div>';
 for(let i=0;i<arr.length;i++){
  const file=arr[i];
  try{const found=await classifyPdf(file);
   if(found.id){await importOnePdf(found.id,file,true);identified++}
   else bulkPending.push({file,pages:found.pages});
  }catch(e){console.warn(e);failed++;bulkPending.push({file,pages:null})}
  const current=document.getElementById('bulkImportStatus');
  if(current)current.textContent='Processando PDF '+(i+1)+' de '+arr.length+'…';
 }
 renderLibrary();
 let current=document.getElementById('bulkImportStatus');
 if(current)current.innerHTML='<div class="notice blue">'+identified+' PDFs associados automaticamente; '+bulkPending.length+' aguardam identificação manual.'+(failed?' Alguns arquivos não puderam ser processados.':'')+'</div>';
}

function recordRange(id,from,to){
 const d=catalog.find(x=>x.id===id);
 if(!d)return;
 const pages=new Set((state.read[id]||[]).map(Number));
 for(let p=Math.max(1,from);p<=Math.min(d.pages,to);p++)pages.add(p);
 state.read[id]=[...pages].sort((a,b)=>a-b);
 persist();
}
function resumeReaderOrNext(){
 const day=reader.day?calcPlan().find(x=>x.date===reader.day):null;
 const chunk=day?.chunks.find(c=>c.id===reader.id);
 if(day&&chunk&&chunkReadCount(chunk)>=chunk.pages){startDay(reader.day);return}
 updateReaderTracking();
}
function completeChunk(){
 const day=reader.day?calcPlan().find(x=>x.date===reader.day):null;
 const chunk=day?.chunks.find(c=>c.id===reader.id);
 if(!chunk||!reader.url){toast('Abra a leitura da agenda para confirmar o trecho.');return}
 recordRange(chunk.id,chunk.start,chunk.end);
 toast('Leitura confirmada. Avançando no roteiro.');
 startDay(day.date);
}
function markThrough(){
 const day=reader.day?calcPlan().find(x=>x.date===reader.day):null;
 const chunk=day?.chunks.find(c=>c.id===reader.id);
 if(!chunk||!reader.url)return;
 const number=Number(document.getElementById('readerThroughPage')?.value);
 if(!Number.isInteger(number)||number<chunk.start||number>chunk.end){toast('Informe uma página válida do trecho.');return}
 recordRange(reader.id,chunk.start,number);
 reader.page=Math.min(chunk.end,number+1);
 toast('Páginas confirmadas até '+number+'.');
 resumeReaderOrNext();
}
function markPage(){
 if(!reader.url){toast('Não foi possível abrir o PDF.');return}
 recordRange(reader.id,reader.page,reader.page);
 const day=reader.day?calcPlan().find(x=>x.date===reader.day):null;
 const chunk=day?.chunks.find(c=>c.id===reader.id);
 const max=chunk?chunk.end:catalog.find(x=>x.id===reader.id).pages;
 if(reader.page<max)reader.page++;
 resumeReaderOrNext();
}

function relatedQuestions(day){
 if(!day?.chunks?.length)return [];
 const topics={};
 for(const c of day.chunks){
  if(!topics[c.area])topics[c.area]=new Set();
  for(const topic of DOC_TOPICS[c.id]||[])topics[c.area].add(topic);
 }
 return pool().filter(q=>{
  if(q.docId)return day.chunks.some(c=>c.id===q.docId&&(!q.pages||(c.start<=q.pages[1]&&c.end>=q.pages[0])));
  return topics[q.subject]?.has(q.topic);
 });
}

function pool(area){
 const base=QUESTION_BANK.map((q,i)=>({subject:q[0],question:q[1],options:q[2],
  answer:q[3],explain:q[4],topic:q[5],id:i}));
 const source=(window.PSICOPITA_STUDY_SOURCE||[]).map((q,i)=>({...q,id:'source-'+i}));
 return base.concat(source).filter(q=>!area||q.subject===area);
}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

  toast('O '+scheduled.title.toLowerCase()+' estará disponível em '+formatDay(scheduled.date)+'.');return;
 }

   simIndex:index,results:[],started:nowIso()};

function answerMock(choice){

 const questions=getExamQuestions(s.simIndex),q=questions[s.at];
 if(!q||s.results.some(r=>r.position===s.at))return;

   topic:q.topic,correct:n===q.answer});

}

function finishMock(){
 const s=state.session;
 if(!s||s.simIndex===undefined)return;
 const questions=getExamQuestions(s.simIndex);
 const answers=s.results;
 if(answers.length!==70||new Set(answers.map(r=>r.position)).size!==70){
  toast('Responda às 70 questões antes de entregar.');return;
 }
 const bySubject={Português:0,Inglês:0,Psicologia:0};
 let correct=0;
 const details=questions.map((q,pos)=>{
  const a=answers.find(r=>r.position===pos),right=a.choice===q.answer;
  if(right){correct++;bySubject[q.subject]++}
  return {id:q.id,subject:q.subject,topic:q.topic,docId:q.sourceId,question:q.question,
   correctOption:q.options[q.answer],answerIndex:q.answer,choiceIndex:a.choice,
   choiceText:q.options[a.choice],correct:right,explain:q.explain};
 });
 state.mockResults=state.mockResults||{};
 state.mockResults[s.simIndex]={index:s.simIndex,correct,total:70,bySubject,

    localStorage.setItem(key,JSON.stringify(state));
    if(currentView==='dashboard'||currentView==='agenda'||currentView==='settings')show(currentView);
    toast('Progresso sincronizado com sua conta.');
   }else if(localTime||!data){await syncUp();}
  }catch(e){console.warn('Falha ao sincronizar progresso',e);toast('Sincronização pendente. Seu progresso continua salvo neste navegador.')}
 })();
 try{await syncDownPromise}finally{syncDownPromise=null}
}
async function syncUp(){
 if(!cloudClient||!cloudUser)return;
 const copy=clone(state); const uid=cloudUser.id;
 try{
  const {error}=await cloudClient.from('study_state').upsert({user_id:uid,payload:copy,updated_at:copy.updatedAt||nowIso()},{onConflict:'user_id'});
  if(error)throw error;
 }catch(e){console.warn('Sincronização com Supabase indisponível',e?.message||e)}
}
async function uploadCloudPDF(id,file){if(!cloudClient||!cloudUser)return;let {error}=await cloudClient.storage.from('study-pdfs').upload(`${cloudUser.id}/${id}.pdf`,file,{upsert:true,contentType:'application/pdf'});if(error)throw error}
async function logout(){if(cloudClient&&cloudUser)await syncUp();if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;state=clone(DEFAULT);localStorage.setItem(key,JSON.stringify(state));renderSettings();toast('Você saiu da conta. Seus dados sincronizados continuam protegidos no Supabase.')}
async function handleAction(b){let act=b.dataset.action;try{if(['dashboard','agenda','library','questions','review','tutor','settings'].includes(act)){state.session=act==='questions'?state.session:state.session;show(act);return}switch(act){case 'resume':resume();break;case 'mockexam':startMock(Number(b.dataset.index));break;case 'mockresult':renderMockResults(Number(b.dataset.index));break;case 'finalmock':finishMock();break;case 'mockpause':state.session=null;persist();show('agenda');break;case 'mockprev':if(state.session?.simIndex!==undefined){state.session.at=Math.max(0,state.session.at-1);persist();renderMock();}break;case 'day':startDay(b.dataset.date);break;case 'readchunk':openReader(b.dataset.id,b.dataset.date);break;case 'attach':attach(b.dataset.id);break;case 'bulkimport':bulkImport();break;case 'bulkchoose':await chooseBulk(Number(b.dataset.index));break;case 'reader':openReader(b.dataset.id,null);break;case 'prevpage':moveReaderPage(-1);break;case 'nextpage':moveReaderPage(1);break;case 'fullscreenreader':await readerFullscreen();break;case 'markpage':markPage();break;case 'completechunk':completeChunk();break;case 'markthrough':markThrough();break;case 'freeread':openReader(reader.id,null);break;case 'startquiz':startQuestions(b.dataset.area,10);break;case 'startsim':show('agenda');break;case 'answer':answer(b.dataset.choice);break;case 'nextquestion':if(state.session){state.session.at++;persist();renderQuestions();}break;case 'stopquiz':if(state.session?.simIndex!==undefined){state.session=null;persist();show('agenda')}else{state.session=null;persist();show('questions')}break;case 'finishquiz':finishQuiz();break;case 'startcards':startFlash(b.dataset.area);break;case 'flipcard':flashSession.flipped=!flashSession.flipped;renderReview();break;case 'flashnext':nextFlash();break;case 'finishcards':finishCards();break;case 'export':exportData();break;case 'import':$('#restoreInput').click();break;case 'login':login();break;case 'loginGoogle':loginGoogle();break;case 'logout':logout();break;case 'askTutor':askTutor();break;default:break}}catch(e){console.error(e);toast('Não foi possível executar. Tente novamente.')}}
async function start(){try{catalog=JSON.parse(document.getElementById('embedded-catalog').textContent)}catch{catalog=[];toast('Catálogo indisponível; abra o site pela hospedagem HTTP.')}document.body.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handleAction(b)});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));$('#mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');$('#pdfFileInput').addEventListener('change',e=>handlePdf(e.target.files[0]));$('#pdfBulkInput').addEventListener('change',e=>handleBulkPdfs(e.target.files));$('#restoreInput').addEventListener('change',e=>e.target.files[0]&&importData(e.target.files[0]));await setupCloud();show('dashboard')}
start();

</script>
